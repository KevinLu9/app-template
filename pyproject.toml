# Tool configuration only. Dependencies live in requirements*.txt (pip + venv).
[project]
name = "app-template-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]
extend-exclude = ["frontend", ".build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106"]
"backend/migrations/**" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
markers = ["db: needs the local Postgres (npm run db:up)"]
